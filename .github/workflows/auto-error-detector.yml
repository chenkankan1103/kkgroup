name: Auto Error Detector
on:
  schedule:
    # 每 10 分鐘檢查一次
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: '測試模式'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - test
          - debug

jobs:
  error-detection:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
    
    steps:
    - name: 檢出代碼
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: 檢查 VM 探測前置條件
      run: |
        if [ -z "$GCP_SA_KEY" ]; then
          echo "❌ 未設置 GCP_SA_KEY，無法從 GitHub Actions 探測 VM systemd/journal" >&2
          exit 1
        fi

    - name: 設置 GCP 認證
      uses: google-github-actions/auth@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        TEST_MODE: ${{ github.event.inputs.test_mode }}
      with:
        credentials_json: ${{ env.GCP_SA_KEY }}

    - name: 安裝 gcloud CLI
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: kkgroup

    - name: 在 VM 上運行自動 Debug 單次探測
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        TEST_MODE: ${{ github.event.inputs.test_mode || 'normal' }}
      run: |
        echo "🚀 啟動 VM 單次自動 Debug 探測"
        echo "📊 測試模式: $TEST_MODE"
        echo "⏰ 開始時間: $(date)"
        gcloud compute ssh e193752468@instance-20250501-142333 \
          --project=kkgroup \
          --zone=us-central1-c \
          --tunnel-through-iap \
          --command "cd /home/e193752468/kkgroup && export PYTHONPATH=/home/e193752468/kkgroup:\$PYTHONPATH && export GITHUB_TOKEN='${GITHUB_TOKEN}' && export DISCORD_WEBHOOK='${DISCORD_WEBHOOK}' && export AUTO_DEBUG_RUN_ONCE=true && python3 -m cogs.common.auto_debug_system"
        
        echo "✅ VM 自動 Debug 探測完成"
        echo "⏰ 結束時間: $(date)"
    
    - name: 檢查 GitHub Actions 修復狀態
      if: always()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "📊 檢查最近的 GitHub Actions 執行狀態"
        
        # 檢查是否有新的修復提交
        if git log --oneline --since="10 minutes ago" | grep -qi "ai 自動修復\|AI Auto Fix\|fix:"; then
          echo "✅ 檢測到自動修復提交"
          echo "🔗 修復已通過 GitHub Actions 自動處理"
        else
          echo "ℹ️ 最近 10 分鐘內無自動修復提交"
        fi
        
        # 檢查修復工作流程狀態
        echo "📋 最近的修復工作流程："
        gh run list --workflow="Auto AI Fix" --limit=3 --json status,conclusion,createdAt | \
          jq -r '.[] | "\(.status): \(.conclusion) - \(.created_at)"' || echo "無法獲取工作流程狀態"
    
    - name: 發送狀態報告
      if: always()
      continue-on-error: true
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        TEST_MODE: ${{ github.event.inputs.test_mode || 'normal' }}
      run: |
        if [ "$DISCORD_WEBHOOK" != "" ]; then
          echo "📢 發送狀態報告到 Discord"

          python3 - <<'PY'
          import os
          from datetime import datetime

          import requests

          payload = {
              "content": "🤖 **自動錯誤檢測器狀態報告**",
              "embeds": [{
                  "title": "系統監控狀態",
                    "description": "GitHub Actions 已透過 GCP SSH 實際探測 VM 上的 systemd/journal 狀態",
                  "color": 5814783,
                  "fields": [
                      {"name": "🤖 檢測器狀態", "value": f"{os.getenv('TEST_MODE', 'normal')} 模式 VM 探測完成", "inline": True},
                      {"name": "⏰ 執行時間", "value": datetime.utcnow().strftime('%Y-%m-%d %H:%M:%S UTC'), "inline": True},
                      {"name": "🔗 探測來源", "value": "GCP VM systemd/journal", "inline": True},
                      {"name": "📊 監控頻率", "value": "每 10 分鐘檢查", "inline": True},
                  ],
              }],
          }

          try:
              response = requests.post(os.environ["DISCORD_WEBHOOK"], json=payload, timeout=15)
              response.raise_for_status()
              print("Discord status report sent")
          except Exception as exc:
              print(f"Discord status report skipped: {exc}")
          PY
        else
          echo "⚠️ 未設置 Discord Webhook，跳過狀態報告"
        fi
