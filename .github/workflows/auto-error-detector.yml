name: Auto Error Detector

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Probe mode"
        required: false
        default: "normal"
        type: choice
        options:
          - normal
          - test
          - debug

jobs:
  error-detection:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate GCP credentials
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "GCP_SA_KEY is not configured; cannot probe VM systemd/journal." >&2
            exit 1
          fi

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: kkgroup

      - name: Run VM auto-debug probe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'normal' }}
        run: |
          echo "Starting VM auto-debug probe"
          echo "Mode: $TEST_MODE"
          echo "Started at: $(date -u)"
          gcloud compute ssh e193752468@instance-20250501-142333 \
            --project=kkgroup \
            --zone=us-central1-c \
            --tunnel-through-iap \
            --command "cd /home/e193752468/kkgroup && export PYTHONPATH=/home/e193752468/kkgroup:\$PYTHONPATH && export GITHUB_TOKEN='${GITHUB_TOKEN}' && export DISCORD_WEBHOOK='${DISCORD_WEBHOOK}' && export AUTO_DEBUG_RUN_ONCE=true && python3 -m cogs.common.auto_debug_system"
          echo "VM auto-debug probe completed at: $(date -u)"

      - name: Summarize recent auto-fix runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Recent commits:"
          git log --oneline --since="10 minutes ago" || true
          echo "Recent Auto AI Fix runs:"
          gh run list --workflow="Auto AI Fix" --limit=3 --json status,conclusion,createdAt,url \
            | jq -r '.[] | "\(.status): \(.conclusion) - \(.createdAt) - \(.url)"' || true

      - name: Send status report
        if: always()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'normal' }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "Discord webhook is not configured; skipping status report"
            exit 0
          fi

          python3 - <<'PY'
          import os
          from datetime import datetime

          import requests

          payload = {
              "content": "Auto Error Detector status report",
              "embeds": [{
                  "title": "System monitor status",
                  "description": "GitHub Actions attempted to probe VM systemd/journal through GCP SSH.",
                  "color": 5814783 if os.getenv("JOB_STATUS") == "success" else 15158332,
                  "fields": [
                      {"name": "Mode", "value": os.getenv("TEST_MODE", "normal"), "inline": True},
                      {"name": "Job status", "value": os.getenv("JOB_STATUS", "unknown"), "inline": True},
                      {"name": "Executed at", "value": datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S UTC"), "inline": True},
                  ],
              }],
          }

          try:
              response = requests.post(os.environ["DISCORD_WEBHOOK"], json=payload, timeout=15)
              response.raise_for_status()
              print("Discord status report sent")
          except Exception as exc:
              print(f"Discord status report skipped: {exc}")
          PY
