name: Deploy KK Park to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/kkpark/**'
      - 'web/kkpark-game/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 一個 repo 只能有一個 Pages 站，所以兩個前端合成同一份 artifact：
      # 首頁放根目錄，遊戲掛在 /game/。遊戲內部全用相對路徑（style.css、
      # data.js、game.js），搬進子目錄不會壞掉。
      - name: 組出要發佈的網站
        run: |
          mkdir -p _site/game
          cp -r web/kkpark/. _site/
          cp -r web/kkpark-game/. _site/game/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
