name: _probe nvidia models

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 逐一實測每一個模型，只列出真的回 200 的
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          curl -sS https://integrate.api.nvidia.com/v1/models \
            -H "Authorization: Bearer $NVIDIA_API_KEY" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(chr(10).join(sorted(m['id'] for m in d.get('data',[]))))" \
            > /tmp/models.txt

          echo "清單共 $(wc -l < /tmp/models.txt) 個模型"
          echo "=== 完整清單 ==="
          cat /tmp/models.txt
          echo "=== 實測結果 ==="

          while read -r M; do
            case "$M" in
              *embed*|*rerank*|*nvclip*|*parse*|*reward*|*guard*|*safety*|*detector*|*translate*|*riva*|*cosmos*|*ising*|*vila*|*neva*|*zamba*|*arctic*|*nemoretriever*|*chatqa*|*nemoguard*) continue ;;
            esac

            BODY=$(printf '{"model":"%s","messages":[{"role":"user","content":"reply with the single word OK"}],"max_tokens":16}' "$M")

            CODE=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
              https://integrate.api.nvidia.com/v1/chat/completions \
              -H "Authorization: Bearer $NVIDIA_API_KEY" \
              -H 'Content-Type: application/json' \
              -d "$BODY")

            if [ "$CODE" = "200" ]; then
              echo "OK   $M"
            else
              echo "FAIL $M  (HTTP $CODE) $(head -c 130 /tmp/out.json)"
            fi
          done < /tmp/models.txt
