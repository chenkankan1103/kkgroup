name: _probe nvidia models

# 臨時探測：找出 NVIDIA NIM 上這把 key 真的叫得動的模型。
# 結果會 commit 成 probe-result.txt，方便直接看。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 逐一實測每個模型
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          curl -sS https://integrate.api.nvidia.com/v1/models \
            -H "Authorization: Bearer $NVIDIA_API_KEY" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(chr(10).join(sorted(m['id'] for m in d.get('data',[]))))" \
            > /tmp/models.txt

          {
            echo "模型總數: $(wc -l < /tmp/models.txt)"
            echo
            echo "=== 可用（HTTP 200）==="
          } > /tmp/result.txt

          while read -r M; do
            case "$M" in
              *embed*|*rerank*|*nvclip*|*parse*|*reward*|*guard*|*safety*|*detector*|*translate*|*riva*|*cosmos*|*ising*|*vila*|*neva*|*zamba*|*arctic*|*nemoretriever*|*chatqa*) continue ;;
            esac

            BODY=$(printf '{"model":"%s","messages":[{"role":"user","content":"reply with the single word OK"}],"max_tokens":16}' "$M")

            CODE=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
              https://integrate.api.nvidia.com/v1/chat/completions \
              -H "Authorization: Bearer $NVIDIA_API_KEY" \
              -H 'Content-Type: application/json' \
              -d "$BODY")

            if [ "$CODE" = "200" ]; then
              echo "OK   $M" >> /tmp/result.txt
            else
              echo "FAIL $M  HTTP $CODE  $(head -c 130 /tmp/out.json)" >> /tmp/result.txt
            fi
          done < /tmp/models.txt

          cp /tmp/result.txt probe-result.txt
          cat probe-result.txt

      - name: 把結果 commit 回 repo
        run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add probe-result.txt
          git diff --cached --quiet || git commit -m "chore: NVIDIA 模型探測結果"
          git push
