name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sqlite3 libsqlite3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt --verbose

      - name: Verify test imports
        run: |
          python -c "import pytest; import pytest_asyncio; import discord.ext.test; print('✅ Test deps OK')"

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short -x
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Lint with ruff
        if: always()
        continue-on-error: true
        run: |
          pip install ruff
          ruff check . --exclude=.venv,__pycache__,.claude

      - name: Check formatting with black
        if: always()
        continue-on-error: true
        run: |
          pip install black
          black --check . --exclude ".venv|__pycache__|\.claude"

