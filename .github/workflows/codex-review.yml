name: Codex Consensus Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

jobs:
  codex-review:
    name: Codex Deep Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for diff

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install codex-claude-bridge
        run: npm install -g codex-claude-bridge@latest

      - name: Get PR diff
        id: diff
        run: |
          git diff origin/main...HEAD -- . \
            ':!tests/**' ':!docs/**' ':!*.md' \
            ':!.venv/' ':!node_modules/' ':!.claude/worktrees/' \
            ':!chroma_db/' ':!graphify-out/' ':!game/' \
            ':!tools/' ':!docs_and_tests/' \
            > /tmp/pr.diff || true
          echo "diff_size=$(wc -c < /tmp/pr.diff)" >> $GITHUB_OUTPUT

      - name: Skip if no Python changes
        if: steps.diff.outputs.diff_size == '0'
        run: |
          echo "No code changes to review"
          echo "verdict=approved" >> $GITHUB_OUTPUT

      - name: Run Codex Review (Deliberate)
        if: steps.diff.outputs.diff_size != '0'
        id: codex
        run: |
          cat /tmp/pr.diff | codex-claude-bridge review-code \
            --diff - \
            --session "pr-${{ github.event.number }}-${{ github.sha }}" \
            --deliberate \
            --json > /tmp/review.json 2>&1 || true
          cat /tmp/review.json
          VERDICT=$(cat /tmp/review.json | python3 -c "
import sys, json
try:
    data = json.load(sys.stdin)
    print(data.get('verdict', 'unknown'))
except:
    print('unknown')
")
          echo "verdict=$VERDICT" >> $GITHUB_OUTPUT

      - name: Post Review Comment
        if: steps.diff.outputs.diff_size != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const verdict = '${{ steps.codex.outputs.verdict }}';
            const reviewBody = await require('fs').promises.readFile('/tmp/review.json', 'utf8').catch(() => '{}');
            let data;
            try { data = JSON.parse(reviewBody); } catch { data = {}; }

            let comment = `## 🤖 Codex Consensus Review\n\n`;
            comment += `**Verdict:** \`${verdict}\`\n\n`;

            if (data.findings && data.findings.length > 0) {
              comment += `### Findings (${data.findings.length})\n\n`;
              for (const f of data.findings) {
                const file = f.file || 'general';
                const line = f.line || 0;
                const msg = f.message || '';
                comment += `- **${file}:${line}** ${msg}\n`;
              }
            } else if (verdict === 'approved') {
              comment += `✅ No issues found. Ready to merge.\n`;
            }

            comment += `\n---\n*Codex review session: ${{ github.run_id }}*`;

            // Update or create comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existing = comments.data.find(c => c.user.type === 'Bot' && c.body.includes('Codex Consensus Review'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

      - name: Fail if Rejected
        if: steps.codex.outputs.verdict == 'rejected' || steps.codex.outputs.verdict == 'changes_requested'
        run: |
          echo "❌ Codex review rejected - see PR comment for details"
          exit 1