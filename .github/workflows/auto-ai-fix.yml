concurrency:
  group: auto-ai-fix-${{ github.event.client_payload.service_hint || github.event.client_payload.incident_key || github.run_id }}
  cancel-in-progress: true

name: Auto AI Fix
on:
  repository_dispatch:
    types: [system_debug, error_analysis]  # 接收來自自動 Debug 系統與 LogMonitor 的請求

jobs:
  ai-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 需要寫入權限來上傳修復代碼
      pull-requests: write
      issues: write
      id-token: write
    
    steps:
    - name: 檢出代碼
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: 設定Python環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: 設定 Python 路徑
      run: |
        echo "PYTHONPATH=$GITHUB_WORKSPACE:$PYTHONPATH" >> $GITHUB_ENV
    
    - name: 安裝依賴
      run: |
        pip install requests aiohttp python-dotenv gitpython
    
    - name: 執行 AI 修復
      env:
        NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        GITHUB_EVENT_DATA: ${{ toJSON(github.event) }}
        AUTO_AI_DIRECT_WRITE: 'true'
      run: |
        python3 scripts/auto_ai_fix.py
