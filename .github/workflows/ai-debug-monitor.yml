name: AI Debug Monitor
on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:
  schedule:
    # 每天凌晨 3 點執行一次（台灣時間）
    - cron: '0 19 * * *'  # UTC 19:00 = 台灣時間 03:00

jobs:
  ai-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    
    steps:
    - name: 檢出代碼
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: 設定Python環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: 設定 Python 路徑
      run: |
        echo "PYTHONPATH=/home/e193752468/kkgroup:$PYTHONPATH" >> $GITHUB_ENV
    
    - name: 安裝依賴
      run: |
        pip install requests aiohttp python-dotenv pytz
    
    - name: AI 錯誤分析器
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        python3 << 'EOF'
        import os
        import re
        import requests
        import aiohttp
        import asyncio
        import random
        import subprocess
        from datetime import datetime, timedelta
        import pytz
        
        # Gemini API配置
        GEMINI_API_KEY = os.getenv("GEMINI_API_KEY")
        DISCORD_WEBHOOK = os.getenv("DISCORD_WEBHOOK")
        
        # 台灣時區設定
        taiwan_tz = pytz.timezone('Asia/Taipei')
        
        def get_taiwan_time():
            """獲取台灣時間"""
            return datetime.now(taiwan_tz)
        
        async def analyze_error_with_ai():
            """使用LiteLLM AI分析最近錯誤日誌（含自動降級和速率限制保護）"""
            
            try:
                import sys
                sys.path.append('/home/e193752468/kkgroup')
                from ai_client_liteLLM import LiteLLMClient
                client = LiteLLMClient()
                use_litellm = True
                print("✅ 使用 LiteLLM 進行AI分析")
            except ImportError as e:
                use_litellm = False
                print(f"⚠️ LiteLLM 載入失敗: {e}")
                print("🔄 降級到傳統API")
            
            # 獲取真實VM日誌
            try:
                # 使用 gcloud 獲取服務狀態
                bot_status = subprocess.run(['gcloud', 'compute', 'ssh', 'instance-20250501-142333', '--project=kkgroup', '--zone=us-central1-c', '--command', 'sudo systemctl is-active bot.service'], capture_output=True, text=True).stdout.strip()
                shopbot_status = subprocess.run(['gcloud', 'compute', 'ssh', 'instance-20250501-142333', '--project=kkgroup', '--zone=us-central1-c', '--command', 'sudo systemctl is-active shopbot.service'], capture_output=True, text=True).stdout.strip()
                uibot_status = subprocess.run(['gcloud', 'compute', 'ssh', 'instance-20250501-142333', '--project=kkgroup', '--zone=us-central1-c', '--command', 'sudo systemctl is-active uibot.service'], capture_output=True, text=True).stdout.strip()
                
                # 獲取最近錯誤日誌
                bot_logs = subprocess.run(['gcloud', 'compute', 'ssh', 'instance-20250501-142333', '--project=kkgroup', '--zone=us-central1-c', '--command', 'sudo journalctl -u bot.service --since "1 hour ago" --no-pager -n 20'], capture_output=True, text=True).stdout
                shopbot_logs = subprocess.run(['gcloud', 'compute', 'ssh', 'instance-20250501-142333', '--project=kkgroup', '--zone=us-central1-c', '--command', 'sudo journalctl -u shopbot.service --since "1 hour ago" --no-pager -n 20'], capture_output=True, text=True).stdout
                uibot_logs = subprocess.run(['gcloud', 'compute', 'ssh', 'instance-20250501-142333', '--project=kkgroup', '--zone=us-central1-c', '--command', 'sudo journalctl -u uibot.service --since "1 hour ago" --no-pager -n 20'], capture_output=True, text=True).stdout
                
                # 檢查是否有實際錯誤
                has_errors = any([
                    "failed" in bot_status.lower() or "inactive" in bot_status.lower(),
                    "failed" in shopbot_status.lower() or "inactive" in shopbot_status.lower(),
                    "failed" in uibot_status.lower() or "inactive" in uibot_status.lower(),
                    "error" in bot_logs.lower() or "exception" in bot_logs.lower(),
                    "error" in shopbot_logs.lower() or "exception" in shopbot_logs.lower(),
                    "error" in uibot_logs.lower() or "exception" in uibot_logs.lower()
                ])
                
                if not has_errors:
                    # 如果沒有實際錯誤，跳過 AI 分析以節省 API 配額
                    print("✅ 系統運行正常，跳過 AI 分析以節省 API 配額")
                    return "系統運行正常，無需分析"
                else:
                    error_logs = f"""
                    服務狀態：
                    - bot.service: {bot_status}
                    - shopbot.service: {shopbot_status}
                    - uibot.service: {uibot_status}
                    
                    最近錯誤日誌：
                    bot.service:
                    {bot_logs[-1000:] if bot_logs else "無日誌"}
                    
                    shopbot.service:
                    {shopbot_logs[-1000:] if shopbot_logs else "無日誌"}
                    
                    uibot.service:
                    {uibot_logs[-1000:] if uibot_logs else "無日誌"}
                    """
                
            except Exception as e:
                error_logs = f"無法獲取VM日誌: {str(e)}"
            
            # AI分析提示
            analysis_prompt = f"""
            你是KKGroup Discord Bot系統的AI除錯專家。
            
            系統環境：
            - GCP VM: e2-micro (1GB RAM + 4GB swap)
            - 三個Bot服務: bot.service, shopbot.service, uibot.service
            - 技術棧: Python 3.11 + Discord.py + systemd
            
            錯誤日誌：
            {error_logs}
            
            請分析：
            1. 根本原因分析
            2. 影響範圍評估
            3. 具體修復步驟
            4. 預防措施建議
            
            請以JSON格式回覆：
            {{
                "root_cause": "主要原因",
                "impact": "影響評估",
                "fix_steps": ["步驟1", "步驟2"],
                "prevention": ["預防措施1", "預防措施2"],
                "confidence": 0.85
            }}
            """
            
            if use_litellm:
                # 使用 LiteLLM
                messages = [
                    {"role": "system", "content": "你是KKGroup Discord Bot系統的AI除錯專家。"},
                    {"role": "user", "content": analysis_prompt}
                ]
                
                response = await client.acomplete(messages)
                if response:
                    print(f"✅ AI分析完成，使用模型: {response.get('model', 'unknown')}")
                    return response["content"]
                else:
                    return "LiteLLM 分析失敗"
            
            else:
                # 傳統API（降級方案）
                max_retries = 3  # 減少重試次數以節省配額
                base_delay = 5   # 增加延遲以避免速率限制
                
                for attempt in range(max_retries):
                    try:
                        # 呼叫Gemini API
                        url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key={GEMINI_API_KEY}"
                        payload = {
                            "contents": [{
                                "parts": [{"text": analysis_prompt}]
                            }],
                            "generationConfig": {
                                "temperature": 0.3,
                                "maxOutputTokens": 800
                            }
                        }
                        
                        async with aiohttp.ClientSession(timeout=aiohttp.ClientTimeout(total=30)) as session:
                            async with session.post(url, json=payload) as response:
                                if response.status == 200:
                                    data = await response.json()
                                    content = data.get("candidates", [{}])[0].get("content", {}).get("parts", [{}])[0].get("text", "{}")
                                    return content
                                elif response.status == 429:
                                    # 速率限制 - 指數退避
                                    delay = base_delay * (2 ** attempt) + random.uniform(0, 1)
                                    print(f"⏳ API速率限制，等待 {delay:.1f} 秒後重試 (嘗試 {attempt + 1}/{max_retries})")
                                    if attempt < max_retries - 1:
                                        await asyncio.sleep(delay)
                                        continue
                                    else:
                                        return "API速率限制，請稍後再試"
                                else:
                                    return f"API呼叫失敗: {response.status}"
                    except Exception as e:
                        if attempt < max_retries - 1:
                            await asyncio.sleep(base_delay * (attempt + 1))
                            continue
                        else:
                            return f"AI分析錯誤: {str(e)}"
                
                return "分析失敗，已達最大重試次數"
        
        async def create_auto_fix(ai_analysis):
            """根據AI分析生成修復代碼"""
            
            fix_prompt = f"""
            基於以下AI分析結果，生成修復代碼：
            
            {ai_analysis}
            
            請生成：
            1. 具體的修復腳本
            2. 修復後的驗證方法
            3. 預防措施建議
            
            請以JSON格式回覆：
            {{
                "fix_script": "修復代碼",
                "verification": "驗證方法",
                "prevention": "預防措施"
            }}
            """
            
            # 使用相同的API呼叫邏輯
            try:
                import sys
                sys.path.append('/home/e193752468/kkgroup')
                from ai_client_liteLLM import LiteLLMClient
                client = LiteLLMClient()
                messages = [
                    {"role": "system", "content": "你是KKGroup Discord Bot系統的修復專家。"},
                    {"role": "user", "content": fix_prompt}
                ]
                
                response = await client.acomplete(messages)
                if response:
                    return response["content"]
                else:
                    return "修復代碼生成失敗"
            except ImportError:
                return "修復代碼生成失敗"
        
        async def send_discord_notification(message, fix_code="", message_id=None):
            """發送或編輯Discord通知"""
            if not DISCORD_WEBHOOK:
                print("❌ 未設定Discord Webhook")
                return
            
            # 如果沒有錯誤，直接返回不發送通知
            if "系統運行正常" in message or "無需分析" in message:
                print("✅ 系統正常，跳過Discord通知")
                return
            
            taiwan_now = get_taiwan_time()
            webhook_data = {
                "content": f"🤖 **AI除錯報告** - {taiwan_now.strftime('%Y-%m-%d %H:%M:%S')}",
                "embeds": [{
                    "title": "🔍 系統錯誤分析",
                    "description": message,
                    "color": 15158332,  # Orange
                    "fields": [
                        {"name": "🤖 AI引擎", "value": "LiteLLM 4層降級", "inline": True},
                        {"name": "📊 分析時間", "value": f"{taiwan_now.strftime('%Y-%m-%d %H:%M:%S')} (台灣時間)", "inline": True},
                        {"name": "🔧 自動修復", "value": "已生成" if fix_code else "僅分析", "inline": True}
                    ]
                }],
                "flags": 4096  # SUPPRESS_NOTIFICATIONS flag
            }
            
            if fix_code:
                # 如果修復代碼太長，創建摘要
                fix_summary = fix_code[:500] + "..." if len(fix_code) > 500 else fix_code
                webhook_data["embeds"][0]["fields"].append({
                    "name": "💻 修復代碼",
                    "value": f"```python\n{fix_summary}\n```",
                    "inline": False
                })
            
            try:
                if message_id:
                    # 編輯現有訊息
                    edit_url = f"{DISCORD_WEBHOOK}/messages/{message_id}"
                    response = requests.patch(edit_url, json=webhook_data)
                    if response.status_code == 204:
                        print(f"✅ Discord通知編輯成功 (ID: {message_id})")
                    else:
                        print(f"❌ Discord通知編輯失敗: {response.status_code}")
                else:
                    # 發送新訊息
                    response = requests.post(DISCORD_WEBHOOK, json=webhook_data)
                    if response.status_code == 204:
                        print("✅ Discord通知發送成功")
                        # 嘗試獲取 message_id（從響應頭中）
                        message_id = response.headers.get('X-Message-ID')
                        if message_id:
                            print(f"📝 訊息ID已註冊: {message_id}")
                            return message_id
                    else:
                        print(f"❌ Discord通知失敗: {response.status_code}")
            except Exception as e:
                print(f"❌ Discord通知錯誤: {str(e)}")
            
            return None
        
        async def main():
            print("🚀 啟動AI除錯監控...")
            
            # 執行AI分析
            ai_analysis = await analyze_error_with_ai()
            print(f"📊 AI分析結果: {ai_analysis[:200]}...")
            
            # 如果系統正常，直接結束
            if "系統運行正常" in ai_analysis or "無需分析" in ai_analysis:
                print("✅ 系統正常，無需發送通知")
                return
            
            # 生成修復代碼
            fix_code = await create_auto_fix(ai_analysis)
            print(f"🔧 修復代碼生成: {'成功' if fix_code and '錯誤' not in fix_code else '失敗'}")
            
            # 發送Discord通知
            message_id = await send_discord_notification(ai_analysis, fix_code)
            
            # 創建GitHub Issue（可選）
            if ai_analysis and "錯誤" not in ai_analysis:
                print("📝 建議創建GitHub Issue追蹤修復進度")
        
        # 執行主程序
        asyncio.run(main())
        EOF
    
    - name: 檢查修復結果
      run: |
        echo "🔍 AI除錯分析完成"
        echo "📊 分析報告已發送到Discord"
        echo "🔧 修復建議已生成"
        echo "📋 請請檢查Discord頻道獲取詳細報告"
    
    - name: 自動修復（可選）
      if: github.event_name == 'workflow_dispatch'
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python3 << 'EOF'
        import os
        import subprocess
        import json
        
        GEMINI_API_KEY = os.getenv("GEMINI_API_KEY")
        
        async def execute_vm_repair():
            """執行VM修復操作"""
            try:
                # 獲取AI分析結果
                print("🔍 獲取AI分析結果...")
                
                # 使用 gcloud 獲取服務狀態
                bot_status = subprocess.run(['gcloud', 'compute', 'ssh', 'instance-20250501-142333', '--project=kkgroup', '--zone=us-central1-c', '--command', 'sudo systemctl is-active bot.service'], capture_output=True, text=True).stdout.strip()
                shopbot_status = subprocess.run(['gcloud', 'compute', 'ssh', 'instance-20250501-142333', '--project=kkgroup', '--zone=us-central1-c', '--command', 'sudo systemctl is-active shopbot.service'], capture_output=True, text=True).stdout.strip()
                uibot_status = subprocess.run(['gcloud', 'compute', 'ssh', 'instance-20250501-142333', '--project=kkgroup', '--zone=us-central1-c', '--command', 'sudo systemctl is-active uibot.service'], capture_output=True, text=True).stdout.strip()
                
                print(f"📊 服務狀態:")
                print(f"  - bot.service: {bot_status}")
                print(f"  - shopbot.service: {shopbot_status}")
                print(f"  - uibot.service: {uibot_status}")
                
                # 智能修復邏輯
                if bot_status == "inactive" or "failed" in bot_status:
                    print("🔄 重啟 bot.service...")
                    result = subprocess.run(['gcloud', 'compute', 'ssh', 'instance-20250501-142333', '--project=kkgroup', '--zone=us-central1-c', '--command', 'sudo systemctl restart bot.service'], capture_output=True, text=True)
                    print(f"重啟結果: {result.stdout}")
                
                if shopbot_status == "inactive" or "failed" in shopbot_status:
                    print("🔄 重啟 shopbot.service...")
                    result = subprocess.run(['gcloud', 'compute', 'ssh', 'instance-20250501-142333', '--project=kkgroup', '--zone=us-central1-c', '--command', 'sudo systemctl restart shopbot.service'], capture_output=True, text=True)
                    print(f"重啟結果: {result.stdout}")
                
                if uibot_status == "inactive" or "failed" in uibot_status:
                    print("🔄 重啟 uibot.service...")
                    result = subprocess.run(['gcloud', 'compute', 'ssh', 'instance-20250501-142333', '--project=kkgroup', '--zone=us-central1-c', '--command', 'sudo systemctl restart uibot.service'], capture_output=True, text=True)
                    print(f"重啟結果: {result.stdout}")
                
                # 檢查記憶體使用情況
                print("🧹 檢查記憶體使用情況...")
                memory_result = subprocess.run(['gcloud', 'compute', 'ssh', 'instance-20250501-142333', '--project=kkgroup', '--zone=us-central1-c', '--command', 'free -h'], capture_output=True, text=True)
                print(f"記憶體狀態: {memory_result.stdout}")
                
                return "VM修復操作完成"
                
            except Exception as e:
                return f"VM修復失敗: {str(e)}"
        
        import asyncio
        result = asyncio.run(execute_vm_repair())
        print(f"✅ 修復操作完成: {result}")
        EOF
