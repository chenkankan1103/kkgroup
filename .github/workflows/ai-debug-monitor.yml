name: AI Debug Monitor

concurrency:
  group: ai-debug-monitor-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
    paths-ignore:
      - docs/**
      - README.md
      - .gitignore
  workflow_dispatch:
    inputs:
      debug_type:
        description: Debug 類型
        required: false
        default: auto
        type: choice
        options:
          - auto
          - force
          - test
      log_content:
        description: 自定義日誌內容（可選）
        required: false
        type: string
  repository_dispatch:
    types: [error_analysis, system_debug]
  schedule:
    - cron: '0 19 * * *'
    - cron: '0 */6 * * *'

jobs:
  ai-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

    steps:
      - name: 檢出代碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝依賴
        run: |
          python -m pip install --upgrade pip --disable-pip-version-check
          python -m pip install --disable-pip-version-check --no-input --retries 5 --timeout 30 requests aiohttp python-dotenv pytz google-cloud-compute

      - name: 設置 GCP 認證
        if: ${{ env.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: 安裝 gcloud CLI
        if: ${{ env.GCP_SA_KEY != '' }}
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: kkgroup

      - name: AI 錯誤分析
        id: analyze
        continue-on-error: true
        env:
          DEBUG_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_type || (github.event_name == 'repository_dispatch' && 'force' || 'auto') }}
          LOG_CONTENT: ${{ github.event_name == 'workflow_dispatch' && inputs.log_content || github.event.client_payload.log_text || '' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_KEY_BACKUP: ${{ secrets.AI_API_KEY_BACKUP }}
          AI_API_MODEL: ${{ secrets.AI_API_MODEL }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python <<'PY'
          import asyncio
          import json
          import os
          import subprocess
          import sys
          import traceback
          from datetime import datetime

          import requests

          try:
            payload = json.loads(os.getenv('EVENT_PAYLOAD') or '{}')
          except Exception as payload_err:
            print(f'Warning: 無法解析 EVENT_PAYLOAD，改用空 payload: {payload_err}')
            payload = {}

          try:
            if not isinstance(payload, dict):
              payload = {}
            debug_type = os.getenv('DEBUG_TYPE', 'auto')
            log_content = (os.getenv('LOG_CONTENT') or '').strip()
            event_name = os.getenv('EVENT_NAME', '')
            incident_signature = str(payload.get('incident_signature') or '').strip()
            incident_key = str(payload.get('incident_key') or '').strip()

            error_logs = ''
            used_source = 'none'

            if event_name == 'repository_dispatch':
              dispatch_logs = payload.get('log_text') or payload.get('error_logs') or payload.get('error_data') or ''
              if isinstance(dispatch_logs, (dict, list)):
                error_logs = json.dumps(dispatch_logs, ensure_ascii=False, indent=2)
              else:
                error_logs = str(dispatch_logs or '').strip()
              used_source = payload.get('source', 'repository_dispatch')
            elif debug_type == 'force':
              error_logs = log_content or '[FORCE] 未提供日誌，使用強制分析模式'
              used_source = 'workflow_dispatch'
            elif debug_type == 'test':
              error_logs = '[TEST] Sample exception for AI debug monitor'
              used_source = 'workflow_dispatch'
            else:
              gcloud_ok = subprocess.run(['gcloud', '--version'], capture_output=True, text=True).returncode == 0
              if gcloud_ok:
                try:
                  bot_status = subprocess.run([
                    'gcloud', 'compute', 'ssh', 'instance-20250501-142333',
                    '--project=kkgroup', '--zone=us-central1-c',
                    '--command', 'sudo systemctl is-active bot.service'
                  ], capture_output=True, text=True, timeout=30).stdout.strip()
                  bot_logs = subprocess.run([
                    'gcloud', 'compute', 'ssh', 'instance-20250501-142333',
                    '--project=kkgroup', '--zone=us-central1-c',
                    '--command', 'sudo journalctl -u bot.service --since "1 hour ago" --no-pager -n 30'
                  ], capture_output=True, text=True, timeout=60).stdout
                  if any(token in (bot_status + '\n' + bot_logs).lower() for token in ['error', 'exception', 'failed', 'traceback', 'inactive']):
                    error_logs = 'bot.service: ' + bot_status + '\n\n' + bot_logs[-2000:]
                    used_source = 'gcp'
                except subprocess.TimeoutExpired:
                  print('GCP SSH timeout, skipping log collection')
                except Exception as ssh_err:
                  print(f'GCP SSH failed: {ssh_err}')

            if not error_logs:
              print('系統運行正常，跳過分析')
              sys.exit(0)

            sev = 'unknown'
            from utils.nvidia_ai import NVIDIAAIClient
            from utils.google_ai import GoogleAIClient

            prompt = (
              '你是 KKGroup Discord Bot 除錯專家。請根據以下錯誤日誌用繁體中文輸出精簡 JSON，'
              '包含 root_cause、impact、fix_steps、prevention、confidence。\n\n'
              f'來源: {used_source}\n\n日誌:\n{error_logs[:6000]}'
            )
            messages = [
              {'role': 'system', 'content': '請只輸出 JSON。'},
              {'role': 'user', 'content': prompt},
            ]
            analysis = asyncio.run(NVIDIAAIClient().call_api(
              messages,
              model='deepseek-ai/deepseek-v4-pro',
              max_tokens=1200,
            )) or ''

            if not analysis:
              groq_key = os.getenv('GROQ_API_KEY', '')
              if groq_key:
                groq_payload = {
                  'model': 'llama-3.3-70b-versatile',
                  'messages': messages,
                  'temperature': 0.4,
                  'max_tokens': 1200,
                }
                groq_headers = {
                  'Authorization': f'Bearer {groq_key}',
                  'Content-Type': 'application/json',
                }
                try:
                  groq_resp = requests.post(
                    'https://api.groq.com/openai/v1/chat/completions',
                    json=groq_payload,
                    headers=groq_headers,
                    timeout=15,
                  )
                  if groq_resp.status_code == 200:
                    groq_data = groq_resp.json()
                    choices = groq_data.get('choices', [])
                    if choices:
                      analysis = choices[0].get('message', {}).get('content', '') or ''
                except Exception as groq_err:
                  print(f'Groq fallback failed: {groq_err}')

            import re
            sev = 'low'
            if re.search(r"(Traceback|CRITICAL|Fatal|Unhandled|oom|killed process|failed with result|status=\d+/FAILURE|panic|permission denied|cannot connect|connection (?:reset|refused|closed))", error_logs, re.IGNORECASE):
              sev = 'high'
            elif re.search(r"\b429\b|rate limit|quota|(?:HTTP|http)\s*[45]\d\d", error_logs, re.IGNORECASE):
              sev = 'medium'

            if not analysis:
              if os.getenv('AI_API_KEY') and sev == 'high':
                analysis = asyncio.run(GoogleAIClient().call_api(
                  messages,
                  temperature=0.2,
                  max_tokens=1200,
                )) or ''
              else:
                print(f"⚠️ NVIDIA+Groq 無回應且 severity={sev}，跳過 Gemini 備援以節省配額")

            print(analysis)

            try:
              parsed_analysis = json.loads(analysis)
            except Exception:
              parsed_analysis = analysis

            result_payload = {
              'incident_signature': incident_signature,
              'incident_key': incident_key,
              'source': used_source,
              'severity': sev,
              'timestamp': datetime.utcnow().isoformat(),
              'completed_at': datetime.utcnow().isoformat(),
              'log_excerpt': error_logs[:2000],
              'analysis': parsed_analysis,
            }
            try:
              with open('ai-debug-result.json', 'w', encoding='utf-8') as result_file:
                json.dump(result_payload, result_file, ensure_ascii=False, indent=2)
            except Exception as e:
              print(f"Warning: Could not write result file: {e}")

            webhook = os.getenv('DISCORD_WEBHOOK')
            analysis_text = analysis.strip() if isinstance(analysis, str) else json.dumps(parsed_analysis, ensure_ascii=False)
            should_notify_discord = (
              bool(webhook)
              and not used_source.startswith('manual_test')
              and analysis_text
              and analysis_text != '無'
            )
            if should_notify_discord:
              try:
                requests.post(
                  webhook,
                  json={
                    'content': '🤖 AI Debug Monitor',
                    'embeds': [{
                      'title': '系統錯誤分析',
                      'description': f'來源: {used_source}',
                      'color': 15158332,
                      'fields': [
                        {
                          'name': '分析結果',
                          'value': (analysis_text[:1000] + ('...' if len(analysis_text) > 1000 else '')) or '無',
                        },
                        {
                          'name': '時間',
                          'value': datetime.utcnow().isoformat(),
                          'inline': True,
                        },
                      ],
                    }],
                  },
                  timeout=15,
                )
              except Exception as e:
                print(f"⚠️ Discord webhook 通知失敗: {e}")
          except Exception as unexpected:
            print('❌ AI Debug Monitor 發生未處理錯誤:')
            traceback.print_exc()
          finally:
            sys.exit(0)
          PY

      - name: 確認 AI 分析結果文件存在
        id: check-result
        if: always()
        run: |
          if [ -f "ai-debug-result.json" ]; then
            echo "✅ AI 分析結果文件存在"
            cat ai-debug-result.json
            echo "result_exists=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ AI 分析結果文件不存在（系統正常或分析失敗）"
            echo "result_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: 上傳 AI 分析結果 Artifact
        if: steps.check-result.outputs.result_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-debug-result-${{ github.event.client_payload.incident_key || github.run_id }}
          path: ai-debug-result.json
          if-no-files-found: warn
