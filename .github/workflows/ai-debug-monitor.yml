name: AI Debug Monitor

concurrency:
  group: ai-debug-monitor-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
    paths-ignore:
      - docs/**
      - README.md
      - .gitignore
  workflow_dispatch:
    inputs:
      debug_type:
        description: Debug 類型
        required: false
        default: auto
        type: choice
        options:
          - auto
          - force
          - test
      log_content:
        description: 自定義日誌內容（可選）
        required: false
        type: string
  repository_dispatch:
    types: [error_analysis, system_debug]
  schedule:
    - cron: '0 19 * * *'
    - cron: '0 */6 * * *'

jobs:
  ai-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

    steps:
      - name: 檢出代碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝依賴
        run: |
          python -m pip install --upgrade pip
          pip install requests aiohttp python-dotenv pytz google-cloud-compute

      - name: 設置 GCP 認證
        if: ${{ env.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: 安裝 gcloud CLI
        if: ${{ env.GCP_SA_KEY != '' }}
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: kkgroup

      - name: AI 錯誤分析
        id: analyze
        env:
          DEBUG_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_type || (github.event_name == 'repository_dispatch' && 'force' || 'auto') }}
          LOG_CONTENT: ${{ github.event_name == 'workflow_dispatch' && inputs.log_content || github.event.client_payload.log_text || '' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_KEY_BACKUP: ${{ secrets.AI_API_KEY_BACKUP }}
          AI_API_MODEL: ${{ secrets.AI_API_MODEL }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python <<'PY'
          import asyncio
          import json
          import os
          import subprocess
          from datetime import datetime

          import requests

          payload = json.loads(os.getenv('EVENT_PAYLOAD') or '{}')
          debug_type = os.getenv('DEBUG_TYPE', 'auto')
          log_content = (os.getenv('LOG_CONTENT') or '').strip()
          event_name = os.getenv('EVENT_NAME', '')
          incident_signature = str(payload.get('incident_signature') or '').strip()
          incident_key = str(payload.get('incident_key') or '').strip()

          error_logs = ''
          used_source = 'none'

          if event_name == 'repository_dispatch':
            dispatch_logs = payload.get('log_text') or payload.get('error_logs') or payload.get('error_data') or ''
            if isinstance(dispatch_logs, (dict, list)):
              error_logs = json.dumps(dispatch_logs, ensure_ascii=False, indent=2)
            else:
              error_logs = str(dispatch_logs or '').strip()
            used_source = payload.get('source', 'repository_dispatch')
          elif debug_type == 'force':
            error_logs = log_content or '[FORCE] 未提供日誌，使用強制分析模式'
            used_source = 'workflow_dispatch'
          elif debug_type == 'test':
            error_logs = '[TEST] Sample exception for AI debug monitor'
            used_source = 'workflow_dispatch'
          else:
            gcloud_ok = subprocess.run(['gcloud', '--version'], capture_output=True, text=True).returncode == 0
            if gcloud_ok:
              bot_status = subprocess.run([
                'gcloud', 'compute', 'ssh', 'instance-20250501-142333',
                '--project=kkgroup', '--zone=us-central1-c',
                '--command', 'sudo systemctl is-active bot.service'
              ], capture_output=True, text=True).stdout.strip()
              bot_logs = subprocess.run([
                'gcloud', 'compute', 'ssh', 'instance-20250501-142333',
                '--project=kkgroup', '--zone=us-central1-c',
                '--command', 'sudo journalctl -u bot.service --since "1 hour ago" --no-pager -n 30'
              ], capture_output=True, text=True).stdout
              if any(token in (bot_status + '\n' + bot_logs).lower() for token in ['error', 'exception', 'failed', 'traceback', 'inactive']):
                error_logs = 'bot.service: ' + bot_status + '\n\n' + bot_logs[-2000:]
                used_source = 'gcp'

          if not error_logs:
            print('系統運行正常，跳過分析')
            raise SystemExit(0)

          sev = 'unknown'
          try:
            from utils.nvidia_ai import NVIDIAAIClient
            from utils.google_ai import GoogleAIClient

            prompt = (
              '你是 KKGroup Discord Bot 除錯專家。請根據以下錯誤日誌用繁體中文輸出精簡 JSON，'
              '包含 root_cause、impact、fix_steps、prevention、confidence。\n\n'
              f'來源: {used_source}\n\n日誌:\n{error_logs[:6000]}'
            )
            messages = [
              {'role': 'system', 'content': '請只輸出 JSON。'},
              {'role': 'user', 'content': prompt},
            ]
            analysis = asyncio.run(NVIDIAAIClient().call_api(
              messages,
              model='deepseek-ai/deepseek-v4-pro',
              max_tokens=1200,
            )) or ''

            # 根據日誌內容推估嚴重度（只在 high 時才呼叫 Gemini 備援）
            import re
            sev = 'low'
            if re.search(r"(Traceback|CRITICAL|Fatal|Unhandled|oom|killed process|failed with result|status=\d+/FAILURE|panic|permission denied|cannot connect|connection (?:reset|refused|closed))", error_logs, re.IGNORECASE):
              sev = 'high'
            elif re.search(r"\b429\b|rate limit|quota|(?:HTTP|http)\s*[45]\d\d", error_logs, re.IGNORECASE):
              sev = 'medium'

            if not analysis:
              if os.getenv('AI_API_KEY') and sev == 'high':
                analysis = asyncio.run(GoogleAIClient().call_api(
                  messages,
                  temperature=0.2,
                  max_tokens=1200,
                )) or ''
              else:
                print(f"⚠️ NVIDIA 無回應且 severity={sev}，跳過 Gemini 備援以節省配額")
          except Exception as exc:
            analysis = json.dumps({
              'root_cause': 'AI 分析失敗',
              'impact': str(exc),
              'fix_steps': ['檢查 NVIDIA_API_KEY', '檢查 workflow 執行日誌'],
              'prevention': ['保留 repository_dispatch payload', '保留 gcloud 認證'],
              'confidence': 0.2,
            }, ensure_ascii=False)

          print(analysis)

          try:
            parsed_analysis = json.loads(analysis)
          except Exception:
            parsed_analysis = analysis

          result_payload = {
            'incident_signature': incident_signature,
            'incident_key': incident_key,
            'source': used_source,
            'severity': sev,
            'timestamp': datetime.utcnow().isoformat(),
            'completed_at': datetime.utcnow().isoformat(),
            'log_excerpt': error_logs[:2000],
            'analysis': parsed_analysis,
          }
          with open('ai-debug-result.json', 'w', encoding='utf-8') as result_file:
            json.dump(result_payload, result_file, ensure_ascii=False, indent=2)

          webhook = os.getenv('DISCORD_WEBHOOK')
          if webhook:
            requests.post(
              webhook,
              json={
                'content': '🤖 AI Debug Monitor',
                'embeds': [{
                  'title': '系統錯誤分析',
                  'description': f'來源: {used_source}',
                  'color': 15158332,
                  'fields': [
                    {
                      'name': '分析結果',
                      'value': (analysis[:1000] + ('...' if len(analysis) > 1000 else '')) or '無',
                    },
                    {
                      'name': '時間',
                      'value': datetime.utcnow().isoformat(),
                      'inline': True,
                    },
                  ],
                }],
              },
              timeout=15,
            )
          PY

      - name: 上傳 AI 分析結果 Artifact
        if: ${{ hashFiles('ai-debug-result.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-debug-result-${{ github.event.client_payload.incident_key || github.run_id }}
          path: ai-debug-result.json
          if-no-files-found: error
