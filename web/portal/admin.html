<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKGroup 管理後台</title>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --border: #2a2d3a;
            --text: #e1e4ed;
            --text-muted: #6b7280;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --radius: 8px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 24px; }
        h1 { font-size: 1.5rem; margin-bottom: 24px; display: flex; align-items: center; gap: 8px; }
        h1 span { color: var(--primary); }

        /* 搜尋區 */
        .search-bar {
            display: flex; gap: 8px; margin-bottom: 24px;
        }
        .search-bar input {
            flex: 1; padding: 10px 16px; border-radius: var(--radius);
            border: 1px solid var(--border); background: var(--surface); color: var(--text);
            font-size: 1rem;
        }
        .search-bar input:focus { outline: none; border-color: var(--primary); }
        .btn {
            padding: 10px 20px; border-radius: var(--radius); border: none;
            font-size: 0.9rem; cursor: pointer; font-weight: 500;
            transition: all 0.15s;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-success { background: var(--success); color: #fff; }
        .btn-success:hover { opacity: 0.9; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-outline {
            background: transparent; border: 1px solid var(--border); color: var(--text);
        }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }

        /* 卡片 */
        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
        }
        .card h2 { font-size: 1.1rem; margin-bottom: 16px; color: var(--text); }

        /* 欄位列表 */
        .field-row {
            display: flex; align-items: center; padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }
        .field-row:last-child { border-bottom: none; }
        .field-label {
            width: 160px; flex-shrink: 0; color: var(--text-secondary);
            font-size: 0.85rem; font-weight: 500;
        }
        .field-value { flex: 1; }
        .field-value input, .field-value select {
            width: 100%; padding: 6px 10px; border-radius: 4px;
            border: 1px solid var(--border); background: var(--bg); color: var(--text);
            font-size: 0.9rem;
        }
        .field-value input:focus { outline: none; border-color: var(--primary); }
        .field-value .readonly {
            padding: 6px 0; color: var(--text-secondary); font-size: 0.9rem;
        }

        /* 提示訊息 */
        .toast {
            position: fixed; top: 20px; right: 20px; padding: 12px 20px;
            border-radius: var(--radius); font-size: 0.9rem; z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        .toast-success { background: #065f46; color: #d1fae5; }
        .toast-error { background: #7f1d1d; color: #fecaca; }
        .toast-info { background: #1e3a5f; color: #dbeafe; }
        @keyframes slideIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* 載入動畫 */
        .spinner {
            display: inline-block; width: 20px; height: 20px;
            border: 2px solid var(--border); border-top-color: var(--primary);
            border-radius: 50%; animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .hidden { display: none !important; }
        .actions { display: flex; gap: 8px; margin-top: 16px; }
        .empty-state { text-align: center; padding: 40px; color: var(--text-secondary); }
        .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <span>⚙️</span> KKGroup 使用者管理後台
        </header>

        <!-- 搜尋區 -->
        <div class="search-bar">
            <input type="text" id="userIdInput" placeholder="輸入使用者 Discord ID（數字）" autofocus>
            <button class="btn btn-primary" onclick="searchUser()">🔍 查詢</button>
            <button class="btn btn-success" onclick="searchAllUsers()">📋 全部使用者</button>
        </div>

        <!-- 管理員驗證區 -->
        <div class="card" style="margin-bottom:16px;">
            <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
                <!-- Discord 登入 -->
                <button id="discordLoginBtn" class="btn btn-primary" onclick="loginWithDiscord()" style="background:#5865F2;">
                    🔐 Discord 登入
                </button>
                <span id="loginStatus" style="font-size:0.85rem;color:var(--text-muted);">未登入</span>
                <button id="discordLogoutBtn" class="btn btn-outline hidden" onclick="logoutDiscord()" style="font-size:0.8rem;padding:6px 12px;">登出</button>
                <span style="flex:1;"></span>
                <!-- API Key 備用 -->
                <span style="font-size:0.8rem;color:var(--text-muted);">或使用 API Key:</span>
                <input type="password" id="adminKey" placeholder="ADMIN_API_KEY" style="width:180px;padding:6px 10px;border-radius:4px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:0.85rem;">
                <button class="btn btn-outline" onclick="saveAdminKey()" style="font-size:0.8rem;padding:6px 12px;">儲存</button>
            </div>
        </div>

        <!-- 載入中 -->
        <div id="loadingArea" class="card hidden">
            <div class="empty-state"><div class="spinner"></div><p style="margin-top:12px">載入中...</p></div>
        </div>

        <!-- 錯誤訊息 -->
        <div id="errorArea" class="card hidden"></div>

        <!-- 使用者列表 -->
        <div id="userListCard" class="card hidden">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <h2>👥 使用者列表 (<span id="userListCount">0</span>)</h2>
                <div style="display:flex;gap:4px;">
                    <button class="btn btn-outline" onclick="searchAllUsers()" style="font-size:0.8rem;padding:4px 10px;">🔄 重新整理</button>
                </div>
            </div>
            <div style="overflow-x:auto;">
                <table style="width:100%;border-collapse:collapse;font-size:0.85rem;">
                    <thead>
                        <tr style="background:var(--bg);text-align:left;">
                            <th style="padding:8px 12px;border-bottom:1px solid var(--border);">User ID</th>
                            <th style="padding:8px 12px;border-bottom:1px solid var(--border);">💰 KK幣</th>
                            <th style="padding:8px 12px;border-bottom:1px solid var(--border);">📊 等級</th>
                            <th style="padding:8px 12px;border-bottom:1px solid var(--border);">💎 XP</th>
                            <th style="padding:8px 12px;border-bottom:1px solid var(--border);">❤️ HP</th>
                            <th style="padding:8px 12px;border-bottom:1px solid var(--border);">⚡ 耐力</th>
                            <th style="padding:8px 12px;border-bottom:1px solid var(--border);">🔥 連續</th>
                            <th style="padding:8px 12px;border-bottom:1px solid var(--border);">👤 暱稱</th>
                        </tr>
                    </thead>
                    <tbody id="userListBody"></tbody>
                </table>
            </div>
            <div style="display:flex;justify-content:center;gap:8px;margin-top:12px;">
                <button class="btn btn-outline" id="prevPageBtn" onclick="changePage(-1)" disabled>⬅️ 上一頁</button>
                <span style="font-size:0.85rem;color:var(--text-muted);padding:8px;">
                    第 <span id="currentPageDisplay">1</span> 頁
                </span>
                <button class="btn btn-outline" id="nextPageBtn" onclick="changePage(1)">下一頁 ➡️</button>
            </div>
        </div>

        <!-- 使用者資料卡片 -->
        <div id="userCard" class="card hidden">
            <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
                <h2 id="userTitle">👤 使用者資料</h2>
                <span id="saveStatus" style="font-size:0.8rem;color:var(--text-secondary);"></span>
            </div>
            <div id="userFields"></div>
            <div class="actions">
                <button class="btn btn-success" onclick="saveUser()">💾 儲存修改</button>
                <button class="btn btn-outline" onclick="resetForm()">↩️ 還原</button>
            </div>
        </div>

        <!-- 快速操作 -->
        <div class="card" style="margin-top:24px;">
            <h2>📋 快速操作</h2>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
                <button class="btn btn-outline" onclick="quickAction('kkcoin', 5000)">💰 +5000 KK幣</button>
                <button class="btn btn-outline" onclick="quickAction('kkcoin', 10000)">💰 +10000 KK幣</button>
                <button class="btn btn-outline" onclick="quickAction('level', 1)">⬆️ +1 等級</button>
                <button class="btn btn-outline" onclick="quickAction('xp', 500)">⭐ +500 XP</button>
                <button class="btn btn-outline" onclick="quickAction('stamina', 10)">⚡ +10 耐力</button>
                <button class="btn btn-outline" onclick="quickAction('hp', 50)">❤️ +50 HP</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>

    <script>
        // ==================== API Base URL 設定 ====================
        // 從同目錄 config.json 讀取後端 API 位置
        // GitHub Pages 上 API_BASE = tunnel URL；tunnel 直接存取時 API_BASE = ''（同源）
        var API_BASE = '';

        async function loadConfig() {
            try {
                const resp = await fetch('./config.json?cache_bust=' + Date.now());
                const config = await resp.json();
                if (config.API_BASE) {
                    API_BASE = config.API_BASE;
                } else if (config.url) {
                    API_BASE = config.url;
                }
                console.log('✅ API_BASE:', API_BASE || '(同源)');
            } catch (e) {
                console.warn('⚠️ 無法載入 config.json，使用同源 API:', e.message);
            }
        }

        function api(path) { return API_BASE + path; }

        let currentUser = null;
        let originalUser = null;
        let adminKey = localStorage.getItem('admin_key') || '';
        let discordToken = localStorage.getItem('discord_token') || '';
        let discordUser = null;

        // 初始化：先載入 config，再驗證 token
        (async function init() {
            await loadConfig();
            if (adminKey) {
                document.getElementById('adminKey').value = adminKey;
            }
            checkDiscordToken();
        })();

        // ==================== Discord 登入 ====================
        async function loginWithDiscord() {
            try {
                const resp = await fetch(api('/api/auth/login'));
                const data = await resp.json();
                if (data.oauth_url) {
                    // 儲存當前頁面 URL 以便回調後返回
                    localStorage.setItem('admin_return_url', window.location.href);
                    window.location.href = data.oauth_url;
                } else {
                    showToast('無法取得 Discord 登入連結', 'error');
                }
            } catch (e) {
                showToast('Discord 登入失敗: ' + e.message, 'error');
            }
        }

        function logoutDiscord() {
            localStorage.removeItem('discord_token');
            localStorage.removeItem('discord_user');
            discordToken = '';
            discordUser = null;
            updateLoginUI();
            showToast('已登出 Discord', 'info');
        }

        async function checkDiscordToken() {
            // 檢查 URL 參數中的 auth_token（從 OAuth 回調返回）
            const params = new URLSearchParams(window.location.search);
            const urlToken = params.get('auth_token');
            if (urlToken) {
                discordToken = urlToken;
                localStorage.setItem('discord_token', discordToken);
                // 清除 URL 參數
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            if (discordToken) {
                try {
                    const resp = await fetch(api('/api/auth/verify'), {
                        headers: { 'Authorization': 'Bearer ' + discordToken }
                    });
                    const data = await resp.json();
                    if (data.authenticated) {
                        discordUser = data.user;
                        localStorage.setItem('discord_user', JSON.stringify(data.user));
                        updateLoginUI();
                    } else {
                        // Token 過期
                        localStorage.removeItem('discord_token');
                        localStorage.removeItem('discord_user');
                        discordToken = '';
                        discordUser = null;
                        updateLoginUI();
                    }
                } catch (e) {
                    console.error('Token 驗證失敗:', e);
                }
            }
            updateLoginUI();
        }

        function updateLoginUI() {
            const loginBtn = document.getElementById('discordLoginBtn');
            const logoutBtn = document.getElementById('discordLogoutBtn');
            const statusEl = document.getElementById('loginStatus');

            if (discordUser) {
                loginBtn.classList.add('hidden');
                logoutBtn.classList.remove('hidden');
                const avatarUrl = discordUser.avatar_url 
                    ? `<img src="${discordUser.avatar_url}" style="width:20px;height:20px;border-radius:50%;vertical-align:middle;margin-right:4px;">` 
                    : '';
                statusEl.innerHTML = `${avatarUrl}✅ 已登入: <strong>${discordUser.username}</strong>`;
                statusEl.style.color = 'var(--success)';
            } else {
                loginBtn.classList.remove('hidden');
                logoutBtn.classList.add('hidden');
                statusEl.textContent = '未登入';
                statusEl.style.color = 'var(--text-muted)';
            }
        }

        // ==================== 使用者列表 ====================
        let allUsersCache = [];
        let userListPage = 0;
        const PAGE_SIZE = 50;

        async function searchAllUsers() {
            const listCard = document.getElementById('userListCard');
            listCard.classList.remove('hidden');
            document.getElementById('userCard').classList.add('hidden');
            document.getElementById('errorArea').classList.add('hidden');
            document.getElementById('loadingArea').classList.remove('hidden');

            try {
                const resp = await fetch(api('/api/users'));
                const data = await resp.json();
                if (data.status === 'ok') {
                    allUsersCache = data.users
                        .filter(u => u.user_id && u.user_id !== '0')
                        .sort((a, b) => (parseFloat(b.kkcoin) || 0) - (parseFloat(a.kkcoin) || 0));
                    userListPage = 0;
                    document.getElementById('userListCount').textContent = allUsersCache.length;
                    renderUserList();
                }
            } catch (e) {
                showToast('載入失敗: ' + e.message, 'error');
            } finally {
                document.getElementById('loadingArea').classList.add('hidden');
            }
        }

        function renderUserList() {
            const start = userListPage * PAGE_SIZE;
            const pageUsers = allUsersCache.slice(start, start + PAGE_SIZE);
            const tbody = document.getElementById('userListBody');
            tbody.innerHTML = pageUsers.map(u => {
                const uid = u.user_id || '';
                const kkcoin = parseInt(u.kkcoin) || 0;
                const level = parseInt(u.level) || 0;
                const xp = parseInt(u.xp) || 0;
                const hp = parseInt(u.hp) || 0;
                const stamina = parseInt(u.stamina) || 0;
                const streak = parseInt(u.streak) || 0;
                const nickname = u.nickname || u.user_name || '';
                return `<tr style="cursor:pointer;border-bottom:1px solid var(--border);"
                        onclick="document.getElementById('userIdInput').value='${uid}';searchUser();"
                        onmouseover="this.style.background='var(--surface)'"
                        onmouseout="this.style.background=''">
                    <td style="padding:8px 12px;font-family:monospace;">${uid}</td>
                    <td style="padding:8px 12px;color:var(--warning);">${kkcoin.toLocaleString()}</td>
                    <td style="padding:8px 12px;">Lv.${level}</td>
                    <td style="padding:8px 12px;">${xp.toLocaleString()}</td>
                    <td style="padding:8px 12px;color:var(--danger);">${hp}</td>
                    <td style="padding:8px 12px;">${stamina}</td>
                    <td style="padding:8px 12px;">${streak}🔥</td>
                    <td style="padding:8px 12px;color:var(--text-muted);">${nickname}</td>
                </tr>`;
            }).join('');

            document.getElementById('currentPageDisplay').textContent = userListPage + 1;
            document.getElementById('prevPageBtn').disabled = userListPage === 0;
            document.getElementById('nextPageBtn').disabled = (start + PAGE_SIZE) >= allUsersCache.length;
        }

        function changePage(delta) {
            const maxPage = Math.ceil(allUsersCache.length / PAGE_SIZE) - 1;
            userListPage = Math.max(0, Math.min(maxPage, userListPage + delta));
            renderUserList();
        }

        function saveAdminKey() {
            adminKey = document.getElementById('adminKey').value.trim();
            if (adminKey) {
                localStorage.setItem('admin_key', adminKey);
                showToast('✅ 密鑰已儲存', 'success');
            } else {
                localStorage.removeItem('admin_key');
                showToast('密鑰已清除', 'info');
            }
        }

        function showToast(msg, type = 'info') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast toast-${type}`;
            setTimeout(() => t.classList.add('hidden'), 3000);
        }

        function showLoading() { document.getElementById('loading').classList.remove('hidden'); }
        function hideLoading() { document.getElementById('loading').classList.add('hidden'); }

        async function searchUser() {
            const userId = document.getElementById('userIdInput').value.trim();
            if (!userId) { showToast('請輸入使用者 ID', 'error'); return; }

            showLoading();
            document.getElementById('errorArea').classList.add('hidden');
            document.getElementById('userCard').classList.add('hidden');

            try {
                const resp = await fetch(api(`/api/user/${userId}`));
                const data = await resp.json();

                if (data.status === 'ok') {
                    currentUser = data.user;
                    originalUser = JSON.parse(JSON.stringify(data.user));
                    renderUser(data.user);
                    document.getElementById('userCard').classList.remove('hidden');
                } else {
                    document.getElementById('errorArea').classList.remove('hidden');
                    document.getElementById('errorArea').innerHTML =
                        `<div class="empty-state"><div class="icon">🔍</div><p>${data.message || '找不到使用者'}</p></div>`;
                }
            } catch (e) {
                showToast('查詢失敗: ' + e.message, 'error');
            } finally {
                hideLoading();
            }
        }

        function renderUser(user) {
            document.getElementById('userTitle').textContent = `👤 使用者: ${user.user_id}`;
            document.getElementById('saveStatus').textContent = '';

            // 定義所有已知欄位的分組、類型與標籤
            const fieldGroups = {
                '基本資訊': {
                    icon: '👤',
                    fields: {
                        'user_id': { label: 'User ID', type: 'readonly' },
                        'user_name': { label: '使用者名稱', type: 'text' },
                        'nickname': { label: '暱稱', type: 'text' },
                        'gender': { label: '⚧ 性別', type: 'text' },
                        'title': { label: '🏷️ 頭銜', type: 'text' },
                        'hobby': { label: '🎯 愛好', type: 'text' },
                        'pre_job': { label: '💼 職業', type: 'text' },
                    }
                },
                '💰 經濟': {
                    icon: '💰',
                    fields: {
                        'kkcoin': { label: 'KK幣', type: 'number' },
                        'digital_usd': { label: '數位美金', type: 'number' },
                        'central_reserve': { label: '中央儲備', type: 'number' },
                        'stock_realized_pnl': { label: '股票已實現損益', type: 'number' },
                    }
                },
                '📊 等級與經驗': {
                    icon: '📊',
                    fields: {
                        'level': { label: '等級', type: 'number' },
                        'xp': { label: '經驗值', type: 'number' },
                    }
                },
                '❤️ 狀態': {
                    icon: '❤️',
                    fields: {
                        'hp': { label: 'HP', type: 'number' },
                        'stamina': { label: '耐力', type: 'number' },
                        'streak': { label: '連續天數', type: 'number' },
                        'actions_used': { label: '已用行動', type: 'number' },
                        'is_stunned': { label: '暈眩', type: 'number' },
                        'is_locked': { label: '鎖定', type: 'number' },
                        'work_card_enabled': { label: '工作卡啟用', type: 'number' },
                        'trend_alert_enabled': { label: '趨勢警報', type: 'number' },
                    }
                },
                '🎨 紙娃娃外觀': {
                    icon: '🎨',
                    fields: {
                        'face': { label: '臉部 ID', type: 'number' },
                        'hair': { label: '髮型 ID', type: 'number' },
                        'skin': { label: '膚色 ID', type: 'number' },
                        'top': { label: '上衣 ID', type: 'number' },
                        'bottom': { label: '下裝 ID', type: 'number' },
                        'shoes': { label: '鞋子 ID', type: 'number' },
                        'glove': { label: '手套 ID', type: 'number' },
                        'earrings': { label: '耳環 ID', type: 'number' },
                        'face_accessory': { label: '臉飾 ID', type: 'number' },
                        'eye_decoration': { label: '眼飾 ID', type: 'number' },
                        'overall': { label: '全身裝 ID', type: 'number' },
                    }
                },
                '🔫 據點戰': {
                    icon: '🏰',
                    fields: {
                        'fortress_wins': { label: '據點戰勝場', type: 'number' },
                        'fortress_total_damage': { label: '總傷害', type: 'number' },
                    }
                },
                '📅 時間戳': {
                    icon: '📅',
                    fields: {
                        'last_work_date': { label: '最後工作日期', type: 'text' },
                        'last_action_date': { label: '最後行動日期', type: 'text' },
                        'last_recovery': { label: '最後恢復時間戳', type: 'text' },
                        'last_activity': { label: '最後活動', type: 'text' },
                        'last_cannabis_confiscation': { label: '最後大麻沒收', type: 'number' },
                        'last_embed_update': { label: '最後嵌入更新', type: 'number' },
                        'last_image_fetch': { label: '最後圖片抓取', type: 'number' },
                        'last_kkcoin_snapshot': { label: '最後 KK 幣快照', type: 'number' },
                        'last_level_snapshot': { label: '最後等級快照', type: 'number' },
                        'last_xp_snapshot': { label: '最後 XP 快照', type: 'number' },
                        'injury_recovery_time': { label: '傷勢恢復時間', type: 'text' },
                    }
                },
            };

            const shown = new Set();
            let html = '';

            // 分組渲染
            for (const [groupName, groupConf] of Object.entries(fieldGroups)) {
                const icon = groupConf.icon || '📋';
                let groupHtml = '';
                let groupCount = 0;
                for (const [key, config] of Object.entries(groupConf.fields)) {
                    if (key in user) {
                        groupHtml += renderField(key, config, user[key]);
                        shown.add(key);
                        groupCount++;
                    }
                }
                if (groupCount > 0) {
                    html += `<div style="margin-bottom:16px;">
                        <div style="font-weight:700;font-size:0.9rem;color:var(--primary);margin-bottom:8px;border-bottom:1px solid var(--border);padding-bottom:4px;">${icon} ${groupName} (${groupCount})</div>
                        ${groupHtml}
                    </div>`;
                }
            }

            // 其他未知欄位
            let unknownHtml = '';
            let unknownCount = 0;
            for (const [key, value] of Object.entries(user)) {
                if (!shown.has(key) && !key.startsWith('_') && key !== 'sync_flag') {
                    const config = { label: key, type: guessType(value) };
                    unknownHtml += renderField(key, config, value);
                    shown.add(key);
                    unknownCount++;
                }
            }
            if (unknownCount > 0) {
                html += `<div style="margin-bottom:16px;">
                    <div style="font-weight:700;font-size:0.9rem;color:var(--text-muted);margin-bottom:8px;border-bottom:1px solid var(--border);padding-bottom:4px;">📌 其他欄位 (${unknownCount})</div>
                    ${unknownHtml}
                </div>`;
            }

            document.getElementById('userFields').innerHTML = html;
        }

        function guessType(value) {
            if (value === null || value === undefined) return 'text';
            if (typeof value === 'number') return 'number';
            if (typeof value === 'boolean') return 'number';
            if (typeof value === 'object') return 'json';
            return 'text';
        }

        function renderField(key, config, value) {
            const label = config.label || key;
            const type = config.type || guessType(value);

            if (type === 'readonly') {
                return `<div class="field-row">
                    <div class="field-label">${label}</div>
                    <div class="field-value"><div class="readonly" style="font-family:monospace;color:var(--text-muted);">${escapeHtml(String(value ?? ''))}</div></div>
                </div>`;
            }
            if (type === 'json') {
                const jsonStr = typeof value === 'string' ? value : JSON.stringify(value, null, 2);
                return `<div class="field-row" style="align-items:flex-start;">
                    <div class="field-label">${label}</div>
                    <div class="field-value">
                        <textarea data-field="${key}" data-type="json" onchange="markChanged()"
                            style="width:100%;min-height:60px;padding:6px 10px;border-radius:4px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:0.8rem;font-family:monospace;resize:vertical;">${escapeHtml(String(jsonStr))}</textarea>
                    </div>
                </div>`;
            }
            const displayVal = (value === null || value === undefined) ? '' : String(value);
            return `<div class="field-row">
                <div class="field-label">${label}</div>
                <div class="field-value">
                    <input type="${type}" data-field="${key}" value="${escapeHtml(displayVal)}"
                        onchange="markChanged()">
                </div>
            </div>`;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function updateChanged() {
            document.getElementById('saveStatus').textContent = '✏️ 已修改';
            document.getElementById('saveStatus').style.color = 'var(--warning)';
        }

        function getFormData() {
            const data = {};
            document.querySelectorAll('#userFields input, #userFields textarea').forEach(input => {
                const key = input.dataset.field;
                let val = input.value;
                if (input.dataset.type === 'json') {
                    try {
                        val = JSON.parse(val);
                    } catch (e) {
                        showToast(`JSON 格式錯誤: ${key}`, 'error');
                        val = currentUser[key]; // keep original
                    }
                } else if (input.type === 'number') {
                    val = val === '' ? 0 : Number(val);
                }
                data[key] = val;
            });
            return data;
        }

        async function saveUser() {
            if (!currentUser) return;
            if (!discordToken && !adminKey) {
                showToast('請先登入 Discord 或輸入 API Key', 'error');
                return;
            }
            const data = getFormData();

            try {
                const headers = {
                    'Content-Type': 'application/json'
                };
                // 優先使用 Discord token
                if (discordToken) {
                    headers['Authorization'] = 'Bearer ' + discordToken;
                } else if (adminKey) {
                    headers['X-Admin-Key'] = adminKey;
                }

                const resp = await fetch(api(`/api/user/${currentUser.user_id}`), {
                    method: 'PUT',
                    headers: headers,
                    body: JSON.stringify(data)
                });
                const result = await resp.json();

                if (resp.ok) {
                    showToast('✅ 儲存成功！', 'success');
                    document.getElementById('saveStatus').textContent = '✅ 已儲存';
                    document.getElementById('saveStatus').style.color = 'var(--success)';
                    // 重新讀取確認
                    await searchUser();
                } else {
                    showToast('儲存失敗: ' + (result.message || '未知錯誤'), 'error');
                }
            } catch (e) {
                showToast('儲存失敗: ' + e.message, 'error');
            }
        }

        function resetForm() {
            if (originalUser) {
                renderUser(originalUser);
                document.getElementById('saveStatus').textContent = '';
            }
        }

        function quickAction(field, amount) {
            if (!currentUser) {
                showToast('請先查詢使用者', 'error');
                return;
            }
            const input = document.querySelector(`input[data-field="${field}"]`);
            if (input) {
                const current = Number(input.value) || 0;
                input.value = current + amount;
                updateChanged();
                showToast(`${field} ${amount >= 0 ? '+' : ''}${amount}`, 'info');
            }
        }

        // Enter 鍵搜尋
        document.getElementById('userIdInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') searchUser();
        });
    </script>
</body>
</html>
