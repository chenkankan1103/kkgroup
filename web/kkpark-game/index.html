<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>KK 園區 · 派遣版</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="map.css">
</head>
<body>

<div class="wrap">

  <header class="hud">
    <div class="hud-left">
      <div class="rank-title" id="rankTitle">待宰豬仔</div>
      <div class="rank-sub" id="rankSub">Lv.0 · 日薪 250</div>
    </div>
    <div class="hud-right">
      <div class="money" id="money">0</div>
      <div class="rate" id="rate">今日額度 24h</div>
    </div>
  </header>

  <section class="map-viewport" id="mapViewport">
    <div class="map-world" id="mapWorld"></div>
    <div class="map-vignette"></div>
    <div class="dpad" id="dpad">
      <button class="dbtn up"    data-dir="up"    aria-label="上">▲</button>
      <button class="dbtn left"  data-dir="left"  aria-label="左">◀</button>
      <button class="dbtn right" data-dir="right" aria-label="右">▶</button>
      <button class="dbtn down"  data-dir="down"  aria-label="下">▼</button>
    </div>
    <button class="act-btn off" id="btnInteract">互動<small>Z</small></button>
  </section>

  <div class="stage-msg" id="stageMsg">正在載入紙娃娃…</div>

  <div class="dbar hidden" id="dbar">
    <div class="dbar-fill" id="dbarFill"></div>
    <div class="dbar-text" id="dbarText"></div>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="dispatch">派遣</button>
    <button class="tab" data-tab="doll">紙娃娃</button>
    <button class="tab" data-tab="gear">設備</button>
    <button class="tab" data-tab="crew">人手</button>
    <button class="tab" data-tab="promo">升職</button>
  </nav>

  <main class="panels">
    <div class="panel active" id="panel-dispatch"></div>
    <div class="panel" id="panel-doll"></div>
    <div class="panel" id="panel-gear"></div>
    <div class="panel" id="panel-crew"></div>
    <div class="panel" id="panel-promo"></div>
  </main>

  <footer class="foot">
    <button class="link" id="btnReset">重來</button>
    <span class="ver">v0.5 地圖版 · 存檔在本機瀏覽器</span>
  </footer>

</div>

<div class="toast-wrap" id="toastWrap"></div>

<div class="modal hidden" id="modal">
  <div class="modal-box">
    <h2 id="modalTitle">歡迎回來</h2>
    <p id="modalBody"></p>
    <button class="btn-primary" id="modalOk">收下</button>
  </div>
</div>

<script src="data.js"></script>
<script src="map.js"></script>
<script src="game.js"></script>
</body>
</html>
