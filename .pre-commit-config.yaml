# ============================================================
# PRE-COMMIT HOOKS: Fast Local Checks (runs on every commit)
# Run: pre-commit install
# Skip: git commit --no-verify
# ============================================================

repos:
  # --- Basic file checks ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=500']

  # --- Python formatting & linting ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # --- Type checking (optional, can be slow) ---
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --no-error-summary, --exclude, 'githooks/find-related\.py$']
        additional_dependencies:
          - types-requests
          - types-pytz

  # --- Unit tests (fast, no integration) ---
  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest unit tests
        entry: python -m pytest tests/ -q --tb=line -x -m "not integration"
        language: system
        pass_filenames: false
        always_run: true
