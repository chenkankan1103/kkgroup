[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "scripts/",
    "scheduled_tasks/",
    "web/",
    "shared/db/",
    "shared/utils/",
    "tests/",
    "utils/",
    "cogs/shop/",
    "cogs/ui/",
    "cogs/common/",
    "bots/",
    "agent_tools.py",
    "db_adapter.py",
    "status_dashboard.py",
    "config/",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = false
# Exclude legacy code directories
exclude = [
    "scripts/",
    "scheduled_tasks/",
    "web/",
    "shared/db/",
    "shared/utils/",
    "tests/",
    "utils/",
    "cogs/shop/",
    "cogs/ui/",
    "cogs/common/",
    "bots/",
    "agent_tools.py",
    "db_adapter.py",
    "status_dashboard.py",
    "config/",
]

[[tool.mypy.overrides]]
module = "cogs.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "shared.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# asyncio_mode="auto"：讓裸 `async def test_*` 直接被收集執行。
# 未設定時 pytest-asyncio 預設 strict，裸 async 測試會以
# "async def functions are not natively supported" 失敗。
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: 需要外部服務或 VM 環境的整合測試（-m 'not integration' 可跳過）",
    "unit: 純單元測試",
]
filterwarnings = [
    "ignore::DeprecationWarning:pytest_asyncio.*",
]
